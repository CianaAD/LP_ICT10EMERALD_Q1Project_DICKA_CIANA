<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Project</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #d12e75, #a61667); 
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background-color: #0f172a;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .nav-links button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.95rem;
            cursor: pointer;
            margin-left: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .nav-links button.active, .nav-links button:hover {
            color: white;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: none;
        }

        .card.active {
            display: block;
        }

        .card-header {
            background: linear-gradient(135deg, #c5518b, #b72d77);
            color: white;
            text-align: center;
            padding: 2.5rem 1.5rem;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .card-header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 0.25rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            color: #1e293b;
        }

        input:focus, select:focus {
            border-color: #151616;
        }

        .menu-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .menu-item label {
            font-size: 0.95rem;
            color: #1e293b;
            font-weight: 500;
        }

        .menu-item input[type="number"] {
            width: 65px;
            text-align: center;
            padding: 0.35rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #fc91c6, #de6bac);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .output-box {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        footer {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Receipt</div>
        <div class="nav-links">
            <button id="btn-sku-nav" class="active" onclick="switchTab('sku')">
                SKU Generator
            </button>
            <button id="btn-receipt-nav" onclick="switchTab('receipt')">
                Receipt Generator
            </button>
        </div>
    </nav>

    <div class="main-container">
        
        <div id="sku-page" class="card active">
            <div class="card-header">
                <h2>SKU Generator</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="category">
                        <option value="USA">USA</option>
                        <option value="Italy">Italy</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" id="product_name" placeholder="e.g. Food">
                </div>

                <div class="form-group">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" id="quantity" placeholder="e.g. 100">
                </div>

                <button class="btn-submit" py-click="SKU_generator">
                    Generate SKU
                </button>

                <div class="output-box" id="sku_output">
                    Your generated SKU will appear here.
                </div>
            </div>
        </div>

        <div id="receipt-page" class="card">
            <div class="card-header">
                <h2>USA & Italy Pasta</h2>
                <p>Food & Drinks</p>
            </div>
            <div class="card-body">
                <div class="menu-title">Menu</div>

                <div class="menu-list">
                    <div class="menu-item">
                        <label for="item1">Truffle Pasta - 200</label>
                        <input type="number" id="item1" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item2">Alfredo Pasta - 180</label>
                        <input type="number" id="item2" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item3">Lasagna - 160</label>
                        <input type="number" id="item3" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item4">Carbonara - 140</label>
                        <input type="number" id="item4" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item5">Pesto Pasta - 130</label>
                        <input type="number" id="item5" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item6">Spaghetti with Meat Sauce - 100</label>
                        <input type="number" id="item6" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item7">Iced Tea - 25</label>
                        <input type="number" id="item7" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item8">Fanta - 25</label>
                        <input type="number" id="item8" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item9">Coca Cola - 25</label>
                        <input type="number" id="item9" value="0" min="0">
                    </div>

                    <div class="menu-item">
                        <label for="item10">Water - ₱20</label>
                        <input type="number" id="item10" value="0" min="0">
                    </div>
                </div>

                <button class="btn-submit" py-click="create_order">
                    <i class="fa-solid fa-receipt"></i> Create Order
                </button>

                <div class="output-box" id="show">
                Your order summary will appear here.
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const skuPage = document.getElementById('sku-page');
            const receiptPage = document.getElementById('receipt-page');
            const skuNav = document.getElementById('btn-sku-nav');
            const receiptNav = document.getElementById('btn-receipt-nav');

            if (tabName === 'sku') {
                skuPage.classList.add('active');
                receiptPage.classList.remove('active');
                skuNav.classList.add('active');
                receiptNav.classList.remove('active');
            } else {
                receiptPage.classList.add('active');
                skuPage.classList.remove('active');
                receiptNav.classList.add('active');
                skuNav.classList.remove('active');
            }
        }
    </script>

    <script type="py">
from pyscript import document, display

def SKU_generator(e):
    document.getElementById('sku_output').innerHTML = " "
    category = document.getElementById('category').value
    product_name = document.getElementById('product_name').value
    stock_qty = document.getElementById('quantity').value
    sku = category[:3].upper() + "-" + product_name[:4].upper() + "-" + str(stock_qty)
    display("SKU: " + sku, target='sku_output')

def create_order(e):
    p1 = 200   # Truffle Pasta
    p2 = 180   # Alfredo Pasta
    p3 = 160   # Lasagna
    p4 = 140   # Carbonara
    p5 = 130   # Pesto Pasta
    p6 = 100   # Spaghetti with Meat Sauce
    p7 = 25    # Iced Tea
    p8 = 25    # Fanta
    p9 = 25    # Coca Cola
    p10 = 20   # Water

    q1 = float(document.getElementById("item1").value or 0)
    q2 = float(document.getElementById("item2").value or 0)
    q3 = float(document.getElementById("item3").value or 0)
    q4 = float(document.getElementById("item4").value or 0)
    q5 = float(document.getElementById("item5").value or 0)
    q6 = float(document.getElementById("item6").value or 0)
    q7 = float(document.getElementById("item7").value or 0)
    q8 = float(document.getElementById("item8").value or 0)
    q9 = float(document.getElementById("item9").value or 0)
    q10 = float(document.getElementById("item10").value or 0)

    subtotal = (p1 * q1) + (p2 * q2) + (p3 * q3) + (p4 * q4) + (p5 * q5) + (p6 * q6) + (p7 * q7) + (p8 * q8) + (p9 * q9) + (p10 * q10)

    tax_rate = 0.12 # 12% VAT
    tax = subtotal * tax_rate
    total = subtotal + tax

    receipt = f"""==== Receipt ====
Subtotal: ₱{subtotal:.2f}
Tax: ₱{tax:.2f}
Total: ₱{total:.2f}
"""

    document.getElementById("show").innerText = receipt
    </script>
</body>
</html>
